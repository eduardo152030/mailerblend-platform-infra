services:
  ingest-gateway:
    build:
      context: ./app
    container_name: analytics-ingest-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      COLLECTOR_VERSION: "v1"
      GCP_PROJECT_ID: "nt-serverside-analytics"
      PUBSUB_TOPIC: "sgtm-events"
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/sa.json"
      INGEST_SECRET: "ff67d47984cc545f8b1510b4a34f6ff6cf5a40f0458849bc"
      # Set later:
      # GCP_PROJECT_ID: "nt-serverside-analytics"
      # PUBSUB_TOPIC: "sgtm-events"
      # INGEST_SECRET: "..."
      # GOOGLE_APPLICATION_CREDENTIALS: "/secrets/sa.json"
    volumes:
      - ./secrets:/secrets:ro

  orbit-gateway-proxy:
    image: nginx:1.25-alpine
    container_name: orbit-gateway-proxy
    restart: unless-stopped
    depends_on:
      - ingest-gateway
    ports:
      - "18088:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
