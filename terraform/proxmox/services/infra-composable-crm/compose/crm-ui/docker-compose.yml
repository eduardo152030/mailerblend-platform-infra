services:
  crm-ui-preview:
    image: ${CRM_UI_IMAGE:-infra-composable-crm/crm-ui:preview}
    build:
      context: .
    ports:
      - "127.0.0.1:${CRM_UI_PREVIEW_PORT:-18089}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
