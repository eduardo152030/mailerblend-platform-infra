server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "connect-src 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /_svc/ {
        default_type application/json;
        return 503 '{"detail":"API no conectada en la preview"}';
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
