services:
  crm-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: infra-composable-crm/crm-api:local
    container_name: crm-api
    restart: unless-stopped
    environment:
      CRM_DB_DSN: "${CRM_DB_DSN}"
      CRM_API_KEY: "${CRM_API_KEY}"
      CRM_BASE_PATH: "${CRM_BASE_PATH}"
      CRM_INGEST_SECRET: "${CRM_INGEST_SECRET}"
    networks:
      - nucleo_network
    ports:
      - "192.168.1.118:18088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

networks:
  nucleo_network:
    external: true
