services:
  budibase-app:
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - "\"\"\"Check actual Budibase topology; use URL credentials without exposing them in argv/logs.\"\"\"\nimport base64\n\
        import json\nimport os\nimport subprocess\nimport urllib.parse\nimport urllib.request\n\n\ndef get(url, auth=False):\n\
        \    u = urllib.parse.urlsplit(url)\n    host = u.hostname + (':' + str(u.port) if u.port else '')\n    req = urllib.request.Request(urllib.parse.urlunsplit((u.scheme,\
        \ host, u.path, u.query, '')))\n    if auth and u.username:\n        credential = urllib.parse.unquote(u.username)\
        \ + ':' + urllib.parse.unquote(u.password or '')\n        req.add_header('Authorization', 'Basic ' + base64.b64encode(credential.encode()).decode())\n\
        \    with urllib.request.urlopen(req, timeout=1.5) as response:\n        if response.status != 200:\n            raise\
        \ RuntimeError('HTTP dependency failed')\n        return response.read(65536)\n\n\ndef check():\n    for url in ['http://127.0.0.1/',\
        \ 'http://127.0.0.1:4001/health', 'http://127.0.0.1:4002/health']:\n        get(url)\n    if json.loads(get('http://127.0.0.1/api/system/status'))['health']['passing']\
        \ is not True:\n        raise RuntimeError('Budibase status failed')\n    couch = urllib.parse.urlsplit(os.environ['COUCH_DB_URL'])\n\
        \    if json.loads(get(urllib.parse.urlunsplit((couch.scheme, couch.netloc, '/_up', '', '')), True)).get('status')\
        \ != 'ok':\n        raise RuntimeError('CouchDB status failed')\n    redis = os.environ['REDIS_URL']\n    redis =\
        \ urllib.parse.urlsplit(redis if '://' in redis else 'redis://' + redis)\n    if redis.scheme not in ['redis', 'rediss']:\n\
        \        raise RuntimeError('Unknown Redis scheme')\n    env = dict(os.environ)\n    env['REDISCLI_AUTH'] = urllib.parse.unquote(redis.password\
        \ or env.get('REDIS_PASSWORD', ''))\n    args = ['redis-cli', '--no-auth-warning', '-h', redis.hostname, '-p', str(redis.port\
        \ or 6379)]\n    if redis.username:\n        args += ['--user', urllib.parse.unquote(redis.username)]\n    if redis.scheme\
        \ == 'rediss':\n        args += ['--tls']\n    pong = subprocess.run(args + ['ping'], env=env, capture_output=True,\
        \ text=True, timeout=2)\n    if pong.returncode != 0 or pong.stdout.strip() != 'PONG':\n        raise RuntimeError('Redis\
        \ status failed')\n    subprocess.run(['nginx', '-t', '-q'], check=True, capture_output=True, timeout=2)\n\n\nif __name__\
        \ == '__main__':\n    try:\n        check()\n    except Exception:\n        # Exceptions can contain credential-bearing\
        \ URLs; never emit them.\n        print('Budibase healthcheck failed; check HTTP/backend/worker/CouchDB/Redis/Nginx\
        \ privately')\n        raise SystemExit(1)\n"
      interval: 15s
      timeout: 15s
      start_period: 45s
      retries: 3
