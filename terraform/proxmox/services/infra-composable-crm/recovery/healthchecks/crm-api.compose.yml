services:
  crm-api:
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import json,urllib.request; r=urllib.request.urlopen("http://127.0.0.1:8080/ready",timeout=2); assert r.status==200
        and json.load(r).get("db")=="ok"
      interval: 10s
      timeout: 3s
      retries: 20
