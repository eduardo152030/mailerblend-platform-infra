server {
    listen 443 ssl;
    server_name infra-eva-ui.mailerblend.com;
    ssl_certificate /etc/letsencrypt/live/mailerblend.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailerblend.com/privkey.pem;
    client_max_body_size 30m;

    location ~ ^/auth/v1/(token|logout)$ {
        limit_except POST { deny all; }
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host infra-svc01.mailerblend.com;
        proxy_pass https://infra-svc01.mailerblend.com;
    }

    location /auth/ { return 404; }

    location /eva-api/ {
        proxy_ssl_server_name on;
        proxy_ssl_name eva-api.internal;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/eva-ui/origin-ca.crt;
        proxy_set_header Host eva-api.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass https://192.168.1.122:18443/;
    }

    location / {
        proxy_ssl_server_name on;
        proxy_ssl_name eva-ui.internal;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/eva-ui/origin-ca.crt;
        proxy_set_header Host eva-ui.internal;
        proxy_pass https://192.168.1.73:18443;
    }
}
