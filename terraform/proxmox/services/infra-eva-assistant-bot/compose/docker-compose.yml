services:
  postgres:
    image: postgres:16-alpine
    container_name: eva-postgres
    restart: unless-stopped
    shm_size: 128mb
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  eva-api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    image: eva-backend:latest
    container_name: eva-api
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  eva-scheduler:
    image: eva-backend:latest
    build: 
      context: ./api
    container_name: eva-scheduler
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    entrypoint: ["python", "run_scheduler.py"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

  # Nuevo servicio para el Cron del Resumen Diario
  eva-cron-digest:
    image: alpine:latest
    container_name: eva-cron-digest
    restart: unless-stopped
    depends_on:
      eva-api:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Instalamos curl y configuramos el crontab para que se ejecute a las 08:00
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl &&
      echo '0 8 * * * curl -s -X POST http://eva-api:8000/digest/send' > /etc/periodic/daily/send-digest &&
      chmod +x /etc/periodic/daily/send-digest &&
      crond -f -l 2"

networks:
  default:
    name: eva-network
    driver: bridge