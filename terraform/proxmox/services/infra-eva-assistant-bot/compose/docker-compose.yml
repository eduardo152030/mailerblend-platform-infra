# Phase 2 preparation: bounded logs; application data and resource allocations unchanged.
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ─────────────────────────────────────────
  # INFRAESTRUCTURA BASE
  # ─────────────────────────────────────────
  postgres:
    logging: *bounded-logging
    image: postgres:16-alpine
    container_name: eva-postgres
    restart: unless-stopped
    shm_size: 128mb
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────
  # EVA — API + SCHEDULER + SYNC + DIGEST
  # ─────────────────────────────────────────
  eva-api:
    logging: *bounded-logging
    build:
      context: ./api
      dockerfile: Dockerfile
    image: eva-backend:latest
    container_name: eva-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      FOCALBOARD_URL: http://focalboard:8000
      FOCALBOARD_TOKEN: ${FOCALBOARD_TOKEN}
      FOCALBOARD_TEAM_ID: ${FOCALBOARD_TEAM_ID}
      FOCALBOARD_BOARD_ID: ${FOCALBOARD_BOARD_ID}
      PERSONA_DIR: /app/persona
      SELF_API_URL: http://localhost:8000
      UPLOADS_DIR: /app/uploads
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /opt/infra-eva-assistant-bot/persona:/app/persona:ro
      - /opt/infra-eva-assistant-bot/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  eva-scheduler:
    logging: *bounded-logging
    image: eva-backend:latest
    container_name: eva-scheduler
    restart: unless-stopped
    env_file: [.env]
    environment:
      FOCALBOARD_URL: http://focalboard:8000
      FOCALBOARD_TOKEN: ${FOCALBOARD_TOKEN}
      FOCALBOARD_TEAM_ID: ${FOCALBOARD_TEAM_ID}
      FOCALBOARD_BOARD_ID: ${FOCALBOARD_BOARD_ID}
      PERSONA_DIR: /app/persona
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /opt/infra-eva-assistant-bot/persona:/app/persona:ro
    entrypoint: ["python", "run_scheduler.py"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

  eva-sync:
    logging: *bounded-logging
    image: eva-backend:latest
    container_name: eva-sync
    restart: unless-stopped
    env_file: [.env]
    environment:
      FOCALBOARD_URL: http://focalboard:8000
      FOCALBOARD_TOKEN: ${FOCALBOARD_TOKEN}
      FOCALBOARD_TEAM_ID: ${FOCALBOARD_TEAM_ID}
      FOCALBOARD_BOARD_ID: ${FOCALBOARD_BOARD_ID}
      PERSONA_DIR: /app/persona
    depends_on:
      postgres:
        condition: service_healthy
      focalboard:
        condition: service_started
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /opt/infra-eva-assistant-bot/persona:/app/persona:ro
    entrypoint: ["python", "sync_service.py"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  eva-cron-digest:
    logging: *bounded-logging
    image: alpine:latest
    container_name: eva-cron-digest
    restart: unless-stopped
    depends_on:
      eva-api:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl &&
      echo '0 8 * * * curl -s -X POST http://eva-api:8000/digest/send' > /etc/periodic/daily/send-digest &&
      chmod +x /etc/periodic/daily/send-digest &&
      crond -f -l 2"

  # ─────────────────────────────────────────
  # MANTENIMIENTO — Limpieza semanal Docker
  # ─────────────────────────────────────────
  docker-cleanup:
    logging: *bounded-logging
    image: docker:cli
    container_name: eva-docker-cleanup
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Reporting only. Data/image/volume deletion requires separate explicit approval.
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Docker storage reporting started; automatic pruning disabled"
        trap 'exit 0' TERM INT
        while true; do
          docker system df
          sleep 604800 &
          wait $$!
        done

    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'

  # ─────────────────────────────────────────
  # FOCALBOARD — UI de proyectos y tareas
  # ─────────────────────────────────────────
  focalboard:
    logging: *bounded-logging
    image: mattermost/focalboard:latest
    container_name: focalboard
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./focalboard/config.json:/opt/focalboard/config.json:ro
      - ./focalboard/data:/opt/focalboard/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      # Focalboard v7.8.9 no tiene /ping — usamos /api/v2/teams que sí responde
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v2/teams", "-H", "X-Requested-With: XMLHttpRequest"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default:
    name: eva-network
    driver: bridge
