log_format drawio_access '$remote_addr $request_method $uri $status';
server {
    listen 18444 ssl;
    server_name drawio.internal;
    ssl_certificate /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log drawio_access;
    allow 192.168.1.71;
    deny all;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $drawio http://drawio:8080;
        proxy_pass $drawio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
