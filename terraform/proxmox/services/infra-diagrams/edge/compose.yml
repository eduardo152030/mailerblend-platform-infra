services:
  gateway:
    image: nginx:1.30-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: unless-stopped
    ports:
      - "192.168.1.63:18444:18444"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./edge/server.pem:/etc/nginx/tls/server.pem:ro
      - ./edge/server.key:/etc/nginx/tls/server.key:ro
