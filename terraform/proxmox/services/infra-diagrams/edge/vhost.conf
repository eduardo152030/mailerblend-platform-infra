server {
    listen 443 ssl http2;
    server_name infra-diagrams.mailerblend.com;
    ssl_certificate /etc/letsencrypt/live/mailerblend.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailerblend.com/privkey.pem;
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    deny all;
    access_log off;
    client_max_body_size 30m;

    location / {
        proxy_pass https://192.168.1.63:18444;
        proxy_ssl_server_name on;
        proxy_ssl_name drawio.internal;
        proxy_ssl_trusted_certificate /etc/nginx/knowledge-platform/ct634-ca.pem;
        proxy_ssl_verify on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_connect_timeout 4s;
    }
}
