modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      valid_http_versions:
      - HTTP/1.1
      - HTTP/2.0
      tls_config:
        insecure_skip_verify: false
      valid_status_codes:
      - 200
      - 204
      - 301
      - 302
  http_2xx_strict:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      tls_config:
        insecure_skip_verify: false
      valid_status_codes:
      - 200
      - 204
  http_collect_200:
    prober: http
    timeout: 10s
    http:
      method: HEAD
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      valid_http_versions:
      - HTTP/1.1
      - HTTP/2.0
      tls_config:
        insecure_skip_verify: false
      valid_status_codes:
      - 200
      - 204
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 3s
    icmp:
      preferred_ip_protocol: ip4
  http_sgtm_health:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      tls_config:
        insecure_skip_verify: false
      valid_status_codes:
      - 200
