services:
  outline:
    environment:
      NODE_EXTRA_CA_CERTS: /run/knowledge/ca.pem
    volumes:
      - ./private/ca.pem:/run/knowledge/ca.pem:ro
    ports: !reset []
    depends_on:
      gateway:
        condition: service_started
  dex:
    image: dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    restart: unless-stopped
    command: [dex, serve, /etc/dex/knowledge.json]
    networks: [frontend]
    volumes:
      - ./private/dex.json:/etc/dex/knowledge.json:ro
      - dex-data:/var/dex
  gateway:
    image: nginx:1.30-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: unless-stopped
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - ./private/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./private/server.pem:/etc/nginx/tls/server.pem:ro
      - ./private/server.key:/etc/nginx/tls/server.key:ro
    networks:
      frontend:
        aliases: [knowledge.test]
volumes:
  dex-data:
