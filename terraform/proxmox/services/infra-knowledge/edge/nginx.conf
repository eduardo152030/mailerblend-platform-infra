map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map "$server_port:$remote_addr" $knowledge_allowed {
    default 0;
    ~^18443: 1;
    "18444:192.168.1.71" 1;
}
log_format knowledge_access '$remote_addr $request_method $uri $status';
server {
    listen 18443 ssl;
    listen 18444 ssl;
    server_name knowledge.test infra-doc.mailerblend.com;
    ssl_certificate /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log knowledge_access;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 64m;
    if ($knowledge_allowed = 0) { return 403; }

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /dex/ {
        set $dex http://dex:5556;
        proxy_pass $dex;
    }
    location / {
        set $outline http://outline:3000;
        proxy_pass $outline;
    }
}
