services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      # POSTGRES_PASSWORD must be provided via environment or .env file
      # See README.md for setup instructions
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      # PASSWORD and POSTGRES_PASSWORD must be provided via environment or .env file
      # See README.md for setup instructions
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons

volumes:
  odoo-db:
  odoo-data:
