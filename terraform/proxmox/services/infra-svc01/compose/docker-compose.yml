services:
  db:
    image: postgres:16-alpine
    container_name: infra-svc01-nocodb-db
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nocodb:
    image: nocodb/nocodb:latest
    container_name: infra-svc01-nocodb
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - NC_DB=${NC_DB}
      - NC_AUTH_JWT_SECRET=${NC_AUTH_JWT_SECRET}
      - TZ=${TZ}
      # --- OPTIMIZACIONES PARA 80 TABLAS Y 15 TÍTULOS ---
      - NODE_OPTIONS=--max-old-space-size=4096
      - NC_REQUEST_BODY_SIZE=100mb
      - DB_POOL_MIN=10
      - DB_POOL_MAX=100
      - NC_DISABLE_TELEMETRY=true
      - NC_CACHE_TTL=60
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      - "18080:8080"
    deploy:
      resources:
        limits:
          memory: 5.5G

volumes:
  pg_data:
  nocodb_data: