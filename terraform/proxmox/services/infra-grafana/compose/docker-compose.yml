services:
  grafana:
    image: grafana/grafana@sha256:2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
    container_name: grafana
    restart: unless-stopped
    ports:
    - 3010:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/'
    volumes:
    - /opt/infra-grafana/config/provisioning:/etc/grafana/provisioning:ro
    - /opt/infra-grafana/config/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
volumes:
  grafana_data: null
