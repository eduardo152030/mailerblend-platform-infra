services:
  voicebox:
    image: local/voicebox:openvoice-d071
    build:
      context: ./pilot-d071
      dockerfile: Dockerfile.app
    container_name: voicebox
    restart: unless-stopped
    ports:
    - 192.168.1.127:17493:17493
    volumes:
    - /srv/voicebox/data:/app/data
    - /srv/voicebox/huggingface:/home/voicebox/.cache/huggingface
    environment:
      VOICEBOX_CLOUD_ENABLED: 'false'
      LOG_LEVEL: info
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_CACHE_DIR: /app/data/cache/numba
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      VOICEBOX_BASE_CPU_ENABLED: '0'
      OPENVOICE_URL: http://openvoice:8080
    cpus: 3
    mem_limit: 2000m
    memswap_limit: 2200m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:17493/health',timeout=5));
        assert d['status']=='healthy'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
    - default
    - voice-private
    depends_on:
      openvoice:
        condition: service_healthy
  openvoice:
    image: local/voicebox-openvoice:d071
    build:
      context: ./pilot-d071
      dockerfile: Dockerfile.worker
    container_name: voicebox-openvoice
    restart: unless-stopped
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 96
    stop_grace_period: 10s
    networks:
    - voice-private
    volumes:
    - /srv/voicebox/openvoice/models:/models:ro
    - /srv/voicebox/data/profiles/1fd00418-2a79-4178-883f-af6c3f5e07ee:/references:ro
    - /srv/voicebox/openvoice/jobs:/jobs
    environment:
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5))['status']=='healthy'
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 30s
networks:
  default: {}
  voice-private:
    internal: true
