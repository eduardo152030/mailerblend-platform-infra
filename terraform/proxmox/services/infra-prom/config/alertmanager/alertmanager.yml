# Rendered locally by scripts/prepare-telegram.py; the token stays in a file.
global:
  resolve_timeout: 5m
route:
  receiver: telegram
  group_by: [alertname, service, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
templates:
  - /etc/alertmanager/templates/*.tmpl
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [instance, service, alertname]
