global:
  resolve_timeout: 5m
route:
  receiver: telegram
  group_by:
  - alertname
  - service
  - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - matchers:
    - severity="critical"
    receiver: telegram
    group_wait: 15s
    group_interval: 1m
    repeat_interval: 1h
  - matchers:
    - severity="warning"
    receiver: telegram
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 6h
  - matchers:
    - severity="info"
    receiver: telegram
    group_wait: 15s
    group_interval: 1m
    repeat_interval: 24h
receivers:
- name: telegram
  telegram_configs:
  - bot_token_file: /run/secrets/telegram_bot_token
    chat_id: __TELEGRAM_CHAT_ID__
    send_resolved: true
    parse_mode: HTML
    message: '{{ template "telegram.message" . }}'
templates:
- /etc/alertmanager/templates/*.tmpl
inhibit_rules:
- source_matchers:
  - severity="critical"
  - resource=~"memory|disk|tls"
  target_matchers:
  - severity="warning"
  - resource=~"memory|disk|tls"
  equal:
  - instance
  - service
  - resource
- source_matchers:
  - alertname="SgtmHealthFailed"
  target_matchers:
  - alertname="DockerContainerUnhealthy"
  equal:
  - instance
  - service
  - name
- source_matchers:
  - alertname="HostOutOfService"
  target_matchers:
  - alertname=~"LxcCpuCollectorInvalid|LxcMemoryMetricsMissing"
  equal:
  - service
- source_matchers:
  - alertname="ExporterDown"
  - job="cadvisor"
  target_matchers:
  - alertname="LxcDockerMetricsMissing"
  equal:
  - service
- source_matchers:
  - alertname="ExporterDown"
  - job="blackbox_exporter"
  target_matchers:
  - alertname="BlackboxScrapeFailed"
