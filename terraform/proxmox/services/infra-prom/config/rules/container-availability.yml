    labels:
      instance: 192.168.1.115:8085
      service: infra-mailerblend-edge
      name: mailerblend-sgtm-serving
      ct_id: '615'
  - alert: ApplicationContainerMissing
    expr: app:container:expected unless on(service,name) container_last_seen{job="cadvisor",name!=""}
    for: 2m
    labels:
      severity: critical
    annotations:
      ct_id: '{{ $labels.ct_id }}'
      summary: 'Contenedor esencial ausente: {{ $labels.name }}'
      description: Sin métricas de este contenedor esperado durante 2m; revisar estado
        Docker. No equivale a una prueba HTTP.
      dashboard_url: http://192.168.1.110:9090/alerts
