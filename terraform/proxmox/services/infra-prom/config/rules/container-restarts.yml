groups:
- name: container_stability
  rules:
  - alert: ContainerRestartLoop
    expr: increase(container_restarts_total{job="cadvisor",container!=""}[10m]) > 3
    for: 0m
    labels:
      severity: warning
      source: prometheus
    annotations:
      summary: "Contenedor reiniciándose ({{ $labels.instance }})"
      description: "container={{ $labels.container }} reinicios >3 en 10m."