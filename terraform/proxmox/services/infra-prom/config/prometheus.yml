global:
  scrape_interval: 30s
  evaluation_interval: 30s
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
rule_files:
- /etc/prometheus/rules/*.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - 127.0.0.1:9090
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
- job_name: blackbox_exporter
  static_configs:
  - targets:
    - 192.168.1.116:9115
- job_name: node
  file_sd_configs:
  - files:
    - /etc/prometheus/targets/node-exporter.json
- job_name: cadvisor
  metrics_path: /metrics
  scheme: http
  file_sd_configs:
  - files:
    - /etc/prometheus/targets/cadvisor.json
- job_name: blackbox
  metrics_path: /probe
  params:
    module:
    - http_2xx
  file_sd_configs:
  - files:
    - /etc/prometheus/targets/blackbox.json
  - files:
    - /etc/prometheus/targets/application-health-stage-a.json
  - files:
    - /etc/prometheus/targets/application-health-complete.json
  relabel_configs:
  - source_labels:
    - __address__
    regex: .*EDGE_FQDN_PLACEHOLDER.*
    action: drop
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - module
    target_label: __param_module
  - target_label: __address__
    replacement: 192.168.1.116:9115
  - source_labels:
    - __param_target
    target_label: instance
- job_name: pve_uptime
  scrape_interval: 30s
  scrape_timeout: 15s
  metrics_path: /pve
  params:
    target:
    - 192.168.1.100
    module:
    - default
    cluster:
    - '1'
    node:
    - '0'
  static_configs:
  - targets:
    - pve-uptime-exporter:9221
  metric_relabel_configs:
  - source_labels:
    - __name__
    - id
    separator: ;
    regex: (pve_uptime_seconds|pve_up|pve_guest_info);lxc/[0-9]+
    action: keep
  - source_labels:
    - id
    regex: lxc/([0-9]+)
    target_label: ct_id
    replacement: $1
