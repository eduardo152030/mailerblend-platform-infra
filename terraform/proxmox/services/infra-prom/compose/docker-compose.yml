services:
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.listen-address=0.0.0.0:9090'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
      - ./config/targets:/etc/prometheus/targets:ro

  alertmanager:
    image: prom/alertmanager:v0.33.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=0.0.0.0:9093'
    ports:
      - "9093:9093"
    volumes:
      - ./.runtime/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.runtime/telegram_bot_token:/run/secrets/telegram_bot_token:ro
      - ./config/alertmanager/templates:/etc/alertmanager/templates:ro
      - alert_data:/alertmanager

volumes:
  prom_data:
  alert_data:
