rule_files:
- ../../services/infra-prom/config/rules/lxc-cpu.yml
- ../../services/infra-prom/config/rules/infra-hosts.yml
evaluation_interval: 30s
tests:
- name: one_busy_core_of_two
  interval: 30s
  input_series:
  - series: up{job="node_exporter",instance="192.0.2.125:9100",service="infra-journal-db",vmid="625",cpu_contract="lxc_cgroup_v1"}
    values: 1x40
  - series: node_textfile_scrape_error{job="node_exporter",instance="192.0.2.125:9100",service="infra-journal-db",vmid="625",cpu_contract="lxc_cgroup_v1"}
    values: '0x40'
  - series: lxc_cpu_usage_seconds_total{job="node_exporter",instance="192.0.2.125:9100",service="infra-journal-db",vmid="625",cpu_contract="lxc_cgroup_v1",ct_id="625",resource_scope="lxc",cpu_source="cgroup_v2"}
    values: 0+30x40
  - series: lxc_cpu_user_seconds_total{job="node_exporter",instance="192.0.2.125:9100",service="infra-journal-db",vmid="625",cpu_contract="lxc_cgroup_v1",ct_id="625",resource_scope="lxc",cpu_source="cgroup_v2"}
    values: 0+20x40
  - series: lxc_cpu_system_seconds_total{job="node_exporter",instance="192.0.2.125:9100",service="infra-journal-db",vmid="625",cpu_contract="lxc_cgroup_v1",ct_id="625",resource_scope="lxc",cpu_source="cgroup_v2"}
    values: 0+10x40
  - series: lxc_cpu_capacity_cores{job="node_exporter",instance="192.0.2.125:9100",service="infra-journal-db",vmid="625",cpu_contract="lxc_cgroup_v1",ct_id="625",resource_scope="lxc",cpu_source="cgroup_v2"}
    values: 2x40
  - series: lxc_cpu_collector_success{job="node_exporter",instance="192.0.2.125:9100",service="infra-journal-db",vmid="625",cpu_contract="lxc_cgroup_v1",ct_id="625",resource_scope="lxc",cpu_source="cgroup_v2"}
    values: 1x40
  - series: lxc_cpu_collector_timestamp_seconds{job="node_exporter",instance="192.0.2.125:9100",service="infra-journal-db",vmid="625",cpu_contract="lxc_cgroup_v1",ct_id="625",resource_scope="lxc",cpu_source="cgroup_v2"}
    values: 0+30x40
  promql_expr_test:
  - expr: lxc:cpu_usage:percent
    eval_time: 19m
    exp_samples:
    - labels: '{__name__="lxc:cpu_usage:percent",cpu_source="cgroup_v2",ct_id="625",instance="192.0.2.125:9100",job="node_exporter",resource_scope="lxc",service="infra-journal-db"}'
      value: 50
  - expr: count(ALERTS{alertname="HostHighCpuUsage",alertstate="firing"})
    eval_time: 19m
    exp_samples: []
