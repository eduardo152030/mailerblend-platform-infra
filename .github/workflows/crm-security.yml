name: CRM security checks
on:
  pull_request:
    paths:
      - terraform/proxmox/services/infra-composable-crm/**
      - .github/workflows/crm-security.yml
  push:
    branches: [main]
    paths:
      - terraform/proxmox/services/infra-composable-crm/**
      - .github/workflows/crm-security.yml
permissions:
  contents: read
jobs:
  crm-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scan CRM source for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum -c
          tar -xz -f "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir terraform/proxmox/services/infra-composable-crm --no-banner --redact=100
      - name: Forbid production CRMAPI in application source
        shell: bash
        run: |
          if git grep -il 'infra-svc01\.mailerblend\.com' -- terraform/proxmox/services/infra-composable-crm/compose/crm-ui/crm-core-main/src; then
            echo 'The CRM UI must use same-origin API paths.' >&2
            exit 1
          fi
